<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGCCC Media - HR System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #3b82f6 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 { text-align: center; font-size: 28px; margin-bottom: 10px; }
        p { text-align: center; color: #6b7280; margin-bottom: 30px; }
        .info-box { background: #dbeafe; color: #1e40af; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: #3b82f6; color: white; transition: all 0.3s; }
        .btn:hover { background: #2563eb; }
        .error { background: #fee2e2; color: #7f1d1d; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .error.show { display: block; }
    </style>
</head>
<body>

<div class="login-container">
    <h1>🏢 YGCCC Media</h1>
    <p>HR Management System</p>

    <div class="info-box"><strong>Password:</strong> password123 for all</div>
    <div id="errorMsg" class="error"></div>

    <div class="form-group">
        <label>Select Employee:</label>
        <select id="empSelect">
            <option value="">-- Choose Employee --</option>
        </select>
    </div>

    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="empPassword" value="password123">
    </div>

    <button class="btn" onclick="login()">Sign In</button>
</div>

<script>
// Employee data
const employees = [
    { id: 1, name: 'George Yu', dept: 'Executive', position: 'CEO', role: 'admin', pass: 'password123' },
    { id: 2, name: 'Lizzy Loren Jangao', dept: 'Finance', position: 'Accounting', role: 'employee', pass: 'password123' },
    { id: 3, name: 'Karoline San Miguel', dept: 'YDS', position: 'Project Manager', role: 'employee', pass: 'password123' },
    { id: 4, name: 'Myka Hosmillo', dept: 'YD', position: 'Outreach', role: 'employee', pass: 'password123' },
    { id: 5, name: 'Muhammad Bin Taimur', dept: 'Engineering', position: 'Automations Engineer', role: 'employee', pass: 'password123' },
    { id: 6, name: 'HR Manager', dept: 'HR', position: 'Manager', role: 'admin', pass: 'password123' },
    { id: 7, name: 'Eryl Karl Agustin', dept: 'YDS & HR', position: 'Project Manager & HR', role: 'employee', pass: 'password123' },
    { id: 8, name: 'Aditya Yata', dept: 'AHS', position: 'Project Manager', role: 'employee', pass: 'password123' },
    { id: 9, name: 'Demir Dumanlar', dept: 'YGCCC', position: 'Operations Slate', role: 'employee', pass: 'password123' },
    { id: 10, name: 'Ann', dept: 'Finance', position: 'Accounting Lead', role: 'employee', pass: 'password123' },
    { id: 11, name: 'Konstantin', dept: 'AHS', position: 'Co-founder', role: 'admin', pass: 'password123' }
];

// Load employees into dropdown
function loadEmployees() {
    const select = document.getElementById('empSelect');
    employees.forEach(emp => {
        const option = document.createElement('option');
        option.value = emp.id;
        option.textContent = emp.name;
        select.appendChild(option);
    });
    console.log('✅ Loaded ' + employees.length + ' employees');
}

// Login function
function login() {
    const empId = document.getElementById('empSelect').value;
    const password = document.getElementById('empPassword').value;
    const errorMsg = document.getElementById('errorMsg');

    if (!empId) {
        errorMsg.textContent = '⚠️ Please select an employee';
        errorMsg.classList.add('show');
        return;
    }

    const emp = employees.find(e => e.id == empId);
    if (emp && emp.pass === password) {
        alert('✅ Login successful! Welcome, ' + emp.name);
        console.log('Logged in as:', emp.name, '(' + emp.role + ')');
    } else {
        errorMsg.textContent = '❌ Invalid password';
        errorMsg.classList.add('show');
    }
}

// Load employees when page loads
loadEmployees();
</script>

</body>
</html>
